[package]
name = "pgt_proxy"
version = "1.0.0"
edition = "2021"
rust-version = "1.81.0"

[dependencies]
tokio = { version = "1.53.0", features = ["full"] }
tokio-rustls = "0.26.4"
rustls = "0.23"
rustls-pemfile = "2.2.0"
clap = { version = "4.6.2", features = ["derive"]}
anyhow = { version = "1.0.103", features = ["backtrace"] }

